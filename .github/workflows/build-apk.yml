name: Build AntiBot APKs

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Auto-generate new Version Name and Code
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import json, os

          run_num = os.environ.get('RUN_NUMBER', '1')

          try:
              with open('version.json', 'r') as f:
                  data = json.load(f)
          except Exception:
              data = {}

          base_ver = data.get('version_name', '1.0.0')
          parts = base_ver.split('.')
          major = parts[0] if len(parts) > 0 else "1"
          minor = parts[1] if len(parts) > 1 else "0"
          new_version_name = f"{major}.{minor}.{run_num}"
          new_version_code = int(run_num) + 120

          data['version_name'] = new_version_name
          data['version_code'] = new_version_code

          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Generated new version: {new_version_name} (code {new_version_code})")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"version_name={new_version_name}\n")
              out.write(f"version_code={new_version_code}\n")
              out.write(f"tag_name=v{new_version_name}\n")
          EOF

      - name: Ensure Project Keystore and Sync Repo
        run: |
          if [ ! -f app/release.jks ]; then
            keytool -genkeypair -v -keystore app/release.jks -alias antibot -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=AntiBot, OU=Mobile, O=OneBot, L=Global, S=Global, C=US"
          fi
          git config user.name "onebotyt"
          git config user.email "gdhami115@gmail.com"
          git add -f app/release.jks || true
          git add version.json || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "ci: sync version.json and keystore for v${{ steps.version.outputs.version_name }} [skip ci]" || true
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Prepare agy_ide_bridge Android ARM64 Daemon
        run: |
          mkdir -p app/src/main/assets/bin
          if [ -s app/src/main/assets/bin/agy_ide_bridge.xz ]; then
            echo "⚡ High-performance Rust daemon already packaged in app/src/main/assets/bin/agy_ide_bridge.xz"
            xz -d -c app/src/main/assets/bin/agy_ide_bridge.xz > app/src/main/assets/bin/agy_ide_bridge
            chmod +x app/src/main/assets/bin/agy_ide_bridge
          else
            echo "❌ Missing app/src/main/assets/bin/agy_ide_bridge.xz!"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Scripts Executable
        run: chmod +x gradlew scripts/build_all_apks.sh

      - name: Build AntiBot Release APKs
        run: ./scripts/build_all_apks.sh --release

      - name: Upload AntiBot APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntiBot-v${{ steps.version.outputs.version_name }}-APKs
          path: output/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "AntiBot v${{ steps.version.outputs.version_name }}"
          body: |
            ### AntiBot v${{ steps.version.outputs.version_name }} Release
            - 🤖 **Auto-built from commit ${{ github.sha }}**
            - ⚡ **Local Model Only (0 Tokens / Offline)**: Run offline coding, commands, dev servers, and summaries without cloud tokens.
            - 🎨 **5 New High-Tech Themes**: Neon Cyberpunk, Midnight Sapphire, Matrix Emerald, Cosmic Amethyst, OLED Pure Black.
            - 📋 **Image Clipboard Paste**: Direct image pasting in chat bar.
            - 🚀 **Self-Learning Dev Server Runner**: Detects Node.js, Python, SQL, Rust, Go recipes with 0-token caching.
            - 🛡️ **Crash & OOM Fixes**: Chunked file streaming, Task Flight Recorder state recovery, and Claude Code stripped.
          files: |
            output/*.apk
            output/agy_ide_bridge*
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
